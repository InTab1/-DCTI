<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DCTI | Dose Career Type Indicator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<main class="container">

    <!-- 시작 화면 -->
    <section id="start-screen" class="card">

	<div class="logo" onclick="clickTarget()" style="cursor: pointer; user-select: none;">🎯</div>

        <h1>도스고 직업 적성 검사 DCTI</h1>

        <h2>
            Dose Career Type Indicator
        </h2>


        <p class="intro">
            성향<br>
            D / C : 행동형 <-> 창작형<br>
P / S : 교류형 <-> 독립형<br>
R / A : 도전형 <-> 안전형<br>
F / T : 자유형 <-> 성장형<br>
        </p>


        <p class="notice">
            20개의 질문을 통해<br>
            당신에게 어울리는 직업과 플레이 스타일을 찾아드립니다.
        </p>


        <button onclick="startTest()">
            검사 시작하기
        </button>


    </section>




    <!-- 질문 화면 -->

    <section id="test-screen" class="card hidden">


        <div class="top">

            <span id="progress-text">
                1 / 32
            </span>

            <div class="progress-bar">

                <div id="progress">
                </div>

            </div>

        </div>


        <h2 id="question">
            질문
        </h2>


        <div id="answers">

        </div>


    </section>





    <!-- 결과 화면 -->

    <section id="result-screen" class="card hidden">


        <div class="result-icon">
            🎉
        </div>


        <h1>
            검사 완료!
        </h1>


        <h2 id="result-type">
            TYPE
        </h2>


        <h2 id="result-name">
            유형명
        </h2>


        <p id="result-desc">
            설명
        </p>



        <div class="job-box">

            <h3>
                추천 직업
            </h3>


            <p id="result-jobs">
                
            </p>

        </div>

	<div class="job-box">

    <h3>
        추천 공무원
    </h3>

    <p id="result-government">

    </p>

</div>





	<button onclick="openAllTypesModal()" style="background: rgba(255,255,255,0.15); margin-top: 15px;">
            📋 전체 유형별 직업 보기
        </button>

        <button onclick="restartTest()">
            다시 검사하기
        </button>


    </section>


</main>

<div id="all-types-modal" class="modal-backdrop hidden">
    <div class="card modal-card">
        <h2>📋 전체 유형별 직업 & 공무원</h2>
        <div id="all-types-content"></div>
        <button onclick="closeAllTypesModal()" style="margin-top: 20px;">닫기</button>
    </div>
</div>


<script src="questions.js"></script>
<script src="results.js"></script>
<script src="script.js"></script>


<div id="easter-egg-modal" class="easter-modal hidden" onclick="closeEasterEgg()">
    <div class="easter-content">
        <p class="easter-sub">도스고등학교</p>
        <h1 class="easter-title">InTab1</h1>
    </div>
</div>
</body>
</html>
